# Weekly OpenSSF Scorecard. Not push-triggered: ci.yml and pages.yml already
# use the two push-triggered workflow slots. The Publisher dispatches this
# once after it lands on main, for the first score. A weekly run keeps it.

name: OpenSSF Scorecard

on:
  schedule:
    # Weekly. Mondays 15:43 UTC.
    - cron: '43 15 * * 1'
  workflow_dispatch:
  branch_protection_rule:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
