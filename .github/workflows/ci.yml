# Standards compliance
#
# PIN_PER_STEP: 2. uv.lock pins the packages. Actions are pinned by commit sha.
#   Atlas is pinned to 1.24.0. The coverage floor in pyproject.toml is 90.
#   Codecov project and patch targets are 90% with a 1% threshold.
#   pip-audit 2.10.1 audits the project environment (the local package is not on PyPI).
# ANDON_AUTHORITY: 2. pytest --cov-fail-under and atlas check are required steps.
#   A red step fails the job. The Codecov upload uses fail_ci_if_error: false
#   so a non-public repo's upload cannot block the gate. The floor is the gate.
# NAMED_COMPENSATORS: 2. This workflow only checks out the repo and runs tests.
#   It does not publish, deploy, or write outside the runner. Undo is to close
#   the pull request. Owner: the author of the pull request. The Publisher merges.
# DECOMPOSE_BY_SECRETS: 2. One push-triggered workflow. Lint, test, a bounded
#   fuzz target, and the map check live in this file.
# UNCERTAINTY_GATED_HUMANS: 2. A failing check stops the merge. R&D reviews the
#   pull request. The Publisher merges.
# EXTERNAL_VERIFIER: n/a. No specialised claim is decided here. R&D reviews the
#   pull request.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "table/**"
      - "receipts/**"
      - "docs/**"
      - "atlas/**"
      - "codecov.yml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Install
        run: uv sync --frozen --extra relay

      - name: Lint
        run: uv run ruff check

      - name: Dependency audit
        run: uv run --with pip-audit==2.10.1 pip-audit

      - name: Test
        run: uv run pytest --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage.xml

      - name: Wheel install loads the C2 specs and inputs
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv venv --python 3.15 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/wheel/*.whl
          for spec in c2-generate c2-fill-card c2-throughput; do
            "$RUNNER_TEMP/wheel-venv/bin/interlock" c2-sources "experiments/$spec/spec.yaml" > /dev/null
          done
          # c2-sources reads the inputs file only with --verify-live (network); load it directly.
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c "from interlock.harness.linux_cuda import load_throughput_inputs_fixture as f; f()"

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Empty table
        run: uv run interlock check

  # Python 3.13. A job of its own so the required status check "test" keeps its name (it runs on 3.15).
  # Lint, tests with the coverage floor, and the wheel install run here; the audit, Atlas check and
  # Codecov upload run once, on the 3.15 job above, and the fuzz step runs on the 3.14 job.
  test-py313:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install
        run: uv sync --frozen --extra relay

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest

      - name: Wheel install loads the C2 specs and inputs
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv venv --python 3.13 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/wheel/*.whl
          for spec in c2-generate c2-fill-card c2-throughput; do
            "$RUNNER_TEMP/wheel-venv/bin/interlock" c2-sources "experiments/$spec/spec.yaml" > /dev/null
          done
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c "from interlock.harness.linux_cuda import load_throughput_inputs_fixture as f; f()"

  # Python 3.14. A job of its own so the required status check "test" keeps its name (it runs on 3.15).
  # Lint, tests with the coverage floor, the fuzz step (atheris has no cp315 wheel yet) and the wheel
  # install run here; the audit, Atlas check and Codecov upload run once, on the 3.15 job above.
  test-py314:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install
        run: uv sync --frozen --extra relay

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest

      - name: Fuzz (atheris has no cp315 wheel yet) receipt and spec parsers
        timeout-minutes: 10
        run: |
          uv sync --group fuzz
          uv run --group fuzz python tests/fuzz_receipts.py -max_total_time=30

      - name: Wheel install loads the C2 specs and inputs
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv venv --python 3.14 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/wheel/*.whl
          for spec in c2-generate c2-fill-card c2-throughput; do
            "$RUNNER_TEMP/wheel-venv/bin/interlock" c2-sources "experiments/$spec/spec.yaml" > /dev/null
          done
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c "from interlock.harness.linux_cuda import load_throughput_inputs_fixture as f; f()"
