[project]
name = "mcptoolshop-interlock"
version = "0.3.0"
description = "Local AI device router: a prototype that sends each job to a model, an engine and a device named by a measured receipt."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "mcp-tool-shop"}]
keywords = [
    "local-ai",
    "gpu",
    "npu",
    "ollama",
    "openvino",
    "device-router",
    "scheduling",
]
dependencies = [
    "jsonschema==4.25.1",
    "nvidia-ml-py==13.615.71",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
intel = [
    "openvino==2026.4.1",
    "openvino-tokenizers==2026.4.1.0",
    "openvino-genai==2026.4.1.0",
    "transformers==5.10.1",
]
# NVIDIA NeMo Relay for `--trace relay` (the interlock-relay experiment, stage 0). Nothing imports it otherwise.
relay = [
    "nemo-relay==0.10.1",
]

[project.scripts]
interlock = "interlock.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.168.5",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "ruff==0.17.0",
    "tokenizers==0.22.2",
]
# Atheris publishes manylinux wheels only. It stays out of default-groups so
# `uv sync` never tries to install it.
fuzz = [
    "atheris==3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interlock"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=interlock --cov-report=term-missing --cov-fail-under=90"
markers = ["relay: needs the relay extra (nemo-relay); skipped without it"]

[tool.coverage.run]
source = ["interlock"]
omit = ["*/schema/*"]

[tool.ruff]
target-version = "py312"
# Sources were already written past the 88 default. 120 keeps E501 on.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Pytest asserts are the test. They are not a check that disappears under -O.
"tests/**/*.py" = ["S101"]
# These files start a local tool (git, nvidia-smi, typeperf) with shell
# false and an argv built in the file. The tests name those same argv.
"src/interlock/adapters/openvino.py" = ["S603", "S607"]
"src/interlock/harness/e4b.py" = ["S603", "S607"]
"src/interlock/harness/environment.py" = ["S603", "S607"]
"src/interlock/harness/fill.py" = ["S603", "S607"]
"src/interlock/harness/lock.py" = ["S603", "S607"]
"src/interlock/harness/storage.py" = ["S603", "S607"]
"src/interlock/harness/watch.py" = ["S603", "S607"]
"src/interlock/importers/assemble.py" = ["S603", "S607"]
"tests/test_fill_card_live.py" = ["S603", "S607"]
"tests/test_harness.py" = ["S603", "S607"]
"tests/test_importers.py" = ["S603", "S607"]
"tests/test_old_name.py" = ["S603", "S607"]
"tests/test_ollama_supervisor.py" = ["S603", "S607"]
"tests/test_ollama_token_count.py" = ["S603", "S607"]
"tests/test_openvino_adapter.py" = ["S603", "S607"]
"tests/test_phi_storage.py" = ["S603", "S607"]
"tests/test_run_path.py" = ["S603", "S607"]
