[project]
name = "mcptoolshop-interlock"
version = "0.1.0"
description = "Local AI device router: a prototype that sends each job to a model, an engine and a device named by a measured receipt."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = [
    "local-ai",
    "gpu",
    "npu",
    "ollama",
    "openvino",
    "device-router",
    "scheduling",
]
dependencies = [
    "jsonschema==4.25.1",
    "nvidia-ml-py==13.615.71",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
intel = [
    "openvino==2026.4.1",
    "openvino-tokenizers==2026.4.1.0",
    "openvino-genai==2026.4.1.0",
    "transformers==5.10.1",
]

[project.scripts]
interlock = "interlock.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.168.5",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interlock"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=interlock --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["interlock"]
omit = ["*/schema/*"]
