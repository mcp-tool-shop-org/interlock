[project]
name = "switchyard"
version = "0.1.0"
description = "Device-aware model router. Each job is sent to a model, engine and device named by a receipt."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "jsonschema==4.25.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
intel = [
    "openvino==2026.4.1",
    "openvino-tokenizers==2026.4.1.0",
    "openvino-genai==2026.4.1.0",
    "transformers==5.5.4",
]

[project.scripts]
switchyard = "switchyard.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=switchyard --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["switchyard"]
omit = ["*/schema/*"]
