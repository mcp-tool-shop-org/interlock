summary: "interlock routes each job to a model, engine and device from a receipt-backed table."
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: assets
    globs:
      - assets/**
    role: data
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: experiments
    globs:
      - experiments/**
    role: data
  - name: receipts
    globs:
      - receipts/**
    role: data
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: src
    globs:
      - src/**
    role: code
  - name: table
    globs:
      - table/**
    role: data
  - name: tests
    globs:
      - tests/**
    role: test
  - name: root
    globs:
      - "*"
    role: config
