# Standards compliance
#
# PIN_PER_STEP: 2. Tasks (embed, rerank, nli), batch sizes (1, 8, 32),
#   abort_fraction (0.90), the 3-VM per card replication, and the Colab card
#   targets (A100-40, A100-80, G4, L4, T4) are pre-registered here.
# ANDON_AUTHORITY: 2. Batch shapes that fail with oom, load_refused, timeout,
#   or ctx_exceeded are recorded as failure rows, never skipped.
# NAMED_COMPENSATORS: 2. Unload is keep_alive 0 on the run-owned Ollama server
#   at 127.0.0.1:11441.
# DECOMPOSE_BY_SECRETS: 2. This file is the pre-registration. The harness runs it.
# UNCERTAINTY_GATED_HUMANS: 2. Runs only inside an authorized C2 Colab sweep window.
# EXTERNAL_VERIFIER: n/a. R&D reviews this spec before any remote window runs.

id: C2-THROUGHPUT
procedure: batch-ladder
platform: linux-cuda
question: >
  What is the items/s throughput and warm latency of embed, rerank, and NLI
  across batch sizes 1, 8, and 32 on each remote Colab card (A100-40, A100-80,
  G4, L4, T4)?
decision: >
  Each (task, batch) shape records items/s throughput and warm p50/p95 latency,
  or a failure row (oom, load_refused, timeout, ctx_exceeded) with its measured
  reason.
abort_fraction: 0.90
tasks:
  - embed
  - rerank
  - nli
batch_sizes:
  - 1
  - 8
  - 32
replication:
  vms_per_card: 3
  windows_per_vm_rep: 2
  windows_per_card: 6
  note: >
    Each card is run on 3 separate VMs (fresh sessions, different pools where
    Colab gives them), split into 2 windows of ~2.4 h per VM-rep (6 windows per
    card, 30 windows total).
needs:
  grant: false
  npu_session: false
  cpu_window: false
dataset:
  name: c2-batch-throughput-inputs
  seed: "The switchyard parity check measures every batch on the same text. "
  rule: >
    Build fixed 512-token inputs at batch sizes 1, 8, and 32 for embed, rerank,
    and NLI.
metrics:
  - throughput
  - warm_p50_ms
  - warm_p95_ms
  - peak_mib
stop_rules:
  - Run-owned Ollama listens on 127.0.0.1:11441; never use shared port 11434 or 11490.
  - Residency and peak VRAM come from NVML or nvidia-smi; no Windows counters are used.
  - Failed batch shapes are recorded as failure rows (oom, load_refused, timeout, ctx_exceeded), never skipped.
