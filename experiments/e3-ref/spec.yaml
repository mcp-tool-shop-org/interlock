# Standards compliance (headers per house style; the full text of the shared
# sections is carried by the twin block, experiments/e3/spec.yaml).

# Amendment, 2026-10-11, after e3-ref-2026-10-11 (R&D).
#
# Defect. The arms carried no prompt: the dataset block named the 1024
# anchor, but no arm referenced it, and the Ollama adapter defaults a missing
# prompt to "". All 14 calls of e3-ref-2026-10-11 sent an empty prompt and
# Ollama returned no generation, so every latency and throughput was null.
# That receipt is kept as evidence only and produced no table row.
#
# Fix. The two anchors below are copied byte for byte from
# experiments/e3/spec.yaml (P1024, and P1024NT, which ends in "/no_think",
# as E3's thinking-off arms use). The thinking-off arm takes P1024NT with
# thinking_level "off" (Ollama think: false); the thinking-on arm takes P1024
# with thinking_level "on" (Ollama think: true; qwen3 takes a boolean, so the
# earlier "low" is replaced). num_ctx is pinned at 4096: the prompt is about
# 960 tokens plus 128 generated, and an unpinned value resolved to 40960.
# Decode tok/s is eval_count / eval_duration from the server, the same
# decode-only quantity as E3's throughput. Ollama reuses the KV cache for an
# identical prompt, so warm TTFT is cached; R_speed uses decode only.
#
# Rest. rest_s is superseded: rest is the Publisher's scheduling decision
# between consecutive long runs, not a harness rule (maintainer, 2026-10-11).

id: E3-REF
procedure: interleaved
compile_cache: reuse
question: >
  How fast is qwen3:8b on the 5090 through Ollama at the 1024-token prompt,
  thinking off and on — the speed reference for E3's descriptive ratio?
decision: >
  None. This spec is a descriptive reference only. E3's ratio is
  R_speed = E3 warm decode tok/s at 1024 / this run's warm decode tok/s at
  1024, per thinking mode, read across the two receipts.
band: 1.0
warmups: 1
repeats: 5
rest_s: 900
needs:
  grant: true
  npu_session: false
  cpu_window: false
  booked_together: false
dataset:
