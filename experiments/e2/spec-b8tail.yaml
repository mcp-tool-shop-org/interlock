# E2 batch-8 tail (R&D, 2026-10-10). Runs after experiments/e2/spec.yaml, same session, one try per arm.

# Amendment, 2026-10-10, after the first tail run (R&D rulings on switchyard issue #36).
#
# Outcome. An NPU compile that the driver compiler refuses, raised inside
# compile_model with "[NPU_VCL] Compiler returned msg" and code 0x78000007, is
# a capability outcome, compile_rejected, scoped to model x device x static
# shape, provisional under the #33 replication rule, never retried. It records
# the compiler message, the code, the NPU driver and the OpenVINO version. Any
# other compile error still aborts.
#
# Excluded arm. qwen3emb-npu-l512-b8 is not run: it had its one try in
# e2-b8tail-2026-10-10c and the driver compiler refused it ("Target buffer size
# '2048' does not match source buffer size '256'"); its row is re-recorded as
# compile_rejected from the logged error.
#
# Run note. e2-b8tail-2026-10-10c at main 58c95c2 stopped at that compile. The
# qwen3emb-npu-l128-b8 cold had passed (compile 45 s) but no repeat ran, so its
# row is aborted and it never had a complete try. qwen3emb-npu-l2048-b8 never
# started. Both run again, one try each, cheapest first, each on a fresh compile
# cache, with a health check before and after the run. A device loss at 8x2048
# is a recorded result, given E1's 8x1024 history.
#
# Rest. rest_s is the length of a conditional rest, applied only after a run of
# over 30 minutes on the same devices that ended less than rest_s ago
# (maintainer, 2026-10-10).

# Amendment, 2026-10-10, after e2-b8tail-2026-10-10d (R&D rulings; harness #47 and #48).
#
# Run note. e2-b8tail-2026-10-10d at main 3b27e6a ran qwen3emb-npu-l128-b8's
# cold (compile finished 20:05:51, blob 1,225,998,470 B), then
# qwen3emb-npu-l2048-b8's compile_model ran about 70 minutes, wrote 0 bytes to
# its cache, and grew the process to 35.3 GB (8,117 CPU-seconds; system RAM 85.8%
# at 21:15). CTRL+C could not land inside the native compile; the process was
# hard-killed at 21:18:22 and no receipt was written. It is an abort, not a
# capability result: l2048-b8 has had its one try, "inconclusive: the compile
# did not finish", and is not run again.
#
# Order. The interleaved order tied the arms' fates together: l128-b8's
# repeats waited on l2048-b8's cold twice. order: blocked replaces it, one
# block per arm, so each arm's cold and repeats finish and flush before the
# next compiles. Only qwen3emb-npu-l128-b8 runs, one complete try.
#
# Bounds. compile_ceiling_s is 900: a compile past it is a compile_timeout
# capability row, never retried. The harness samples system RAM every 2 s and
# stops cleanly at 88%.

# Amendment, 2026-10-11 (maintainer). Rest is the Publisher's scheduling decision between consecutive long runs, not a harness rule; rest_s below is no longer read.
id: E2
procedure: interleaved
order: blocked
compile_ceiling_s: 900
blocks:
  - id: npu-l128-b8
    arms: [qwen3emb-npu-l128-b8]
  - id: npu-l512-b8
    arms: [qwen3emb-npu-l512-b8]
  - id: npu-l2048-b8
    arms: [qwen3emb-npu-l2048-b8]
compile_cache: fresh
question: >
  The batch-8 tail of E2. The NPU arms with batch > 1 run here, in one final
  block after the main run of experiments/e2/spec.yaml, in the same booked
  session and quiet CPU window, cheapest first. They moved here because NPU
  batch-8 shapes have lost the device before (nomic 8x1024 3/3 and 8x2048 1/1
  in E1, with correct inputs), so they must not stop the main run.
decision: >
  Descriptive only, as in the main spec: warm statistics and the parity guard
  (first repeat row cosine >= 0.999 against the CPU batch-1 arm at the same
  length, from the main run) are recorded. A device loss or hang is a recorded
  row with no timing, later arms are marked not run, and nothing is retried.
band: 1.0
warmups: 1
repeats: 19
rest_s: 900
needs:
  grant: false
  npu_session: true
  cpu_window: true
  booked_together: true
dataset:
  name: e2-fixed-prompt
  seed: "The switchyard counts the same cars on every pass. "
  target_tokens: 2048
  rule: >
    Repeat the seed until the model tokenizer counts at least 2048 tokens,
    then keep the shortest prefix of that repetition that still counts as
    2048. Every arm gets the same prefix; the adapter right-truncates to
    the arm's static length, so every device sees byte-identical tokens at
    each length. The dropped count is recorded as truncated_tokens. No
    instruction prefix is prepended — E2 measures identical generic tokens
    for speed and parity, not the retrieval recipe. Every E2 row carries
    the label "speed and parity only; not the retrieval recipe".
metrics:
  - compile_ms
  - compile_warm_reload_ms
  - first_call_ms
  - latency_ms
  - throughput
  - truncated_tokens
stop_rules:
  - A non-zero step stops the sequence. Later arms do not run.
  - Every arm is static-shaped on every device, so all devices see
    identical tokens and identical shapes per length.
  - Cold is once per arm on its fresh compile cache and stays out of the
    percentiles; the cold row carries compile_ms and
    compile_warm_reload_ms, and first-call time beside them.
  - Repeats are deterministic — the same artifact and the same tokens give
    the same vector, so the parity guard reads the first repeat row.
  - The pin is the official OpenVINO export OpenVINO/Qwen3-Embedding-0.6B-fp16-ov at 82a0035040926a5c0dcf251209218e096c5eeb1c,
    licence apache-2.0 verified on the hub this week. The fp16 IR is the
    parity-faithful choice — the CPU reference runs the same artifact.
  - Pooling is last-token, the model card's recipe, pinned in the adapter
    table and recorded per row.
  - E2 arms are an embedding model, so the batch-8 cross-encoder refusal
    does not apply. Every measured call carries the adapter's automatic
    60 second per-call bound — a hang returns ok=False, marks the arm
    inconclusive, poisons the model+device pair for the run, and the
    runner's non-zero-step stop ends the sequence and the session.
  - The NPU, iGPU and CPU arms run in one booked block inside a quiet CPU
    window. The 900 second rest is taken before the block, not between
    arms.
  - Booked through the Publisher; never beside a timed calibration or the
    math ladder on the 5090.
  - Retrieval quality, calibration and any benchmark placement belong to
    the later retrieval benchmark, not this run. Every row this run writes
    is labelled "speed and parity only; not the retrieval recipe", and that
    label travels into the report.
arms:
  - id: qwen3emb-npu-l128-b8
    task: embed
    device: NPU
    engine: openvino
    model: OpenVINO/Qwen3-Embedding-0.6B-fp16-ov@82a0035040926a5c0dcf251209218e096c5eeb1c
    revision_or_digest: 82a0035040926a5c0dcf251209218e096c5eeb1c
    quant: fp16
    licence: apache-2.0
    engine_version: "2026.4.1"
    thinking_level: "off"
    num_predict: null
    num_ctx: null
    batch: 8
    static_shape: "8x128"
    measure: latency_ms
  - id: qwen3emb-npu-l512-b8
    not_run: compile_rejected in e2-b8tail-2026-10-10c (the driver compiler refused 8x512); one try per arm (issue #36)
    task: embed
    device: NPU
    engine: openvino
    model: OpenVINO/Qwen3-Embedding-0.6B-fp16-ov@82a0035040926a5c0dcf251209218e096c5eeb1c
    revision_or_digest: 82a0035040926a5c0dcf251209218e096c5eeb1c
    quant: fp16
    licence: apache-2.0
    engine_version: "2026.4.1"
    thinking_level: "off"
    num_predict: null
    num_ctx: null
    batch: 8
    static_shape: "8x512"
    measure: latency_ms
  - id: qwen3emb-npu-l2048-b8
    not_run: had its one try in e2-b8tail-2026-10-10d; the compile did not finish in 70 min (inconclusive, issue #36)
    task: embed
    device: NPU
    engine: openvino
    model: OpenVINO/Qwen3-Embedding-0.6B-fp16-ov@82a0035040926a5c0dcf251209218e096c5eeb1c
    revision_or_digest: 82a0035040926a5c0dcf251209218e096c5eeb1c
    quant: fp16
    licence: apache-2.0
    engine_version: "2026.4.1"
    thinking_level: "off"
    num_predict: null
    num_ctx: null
    batch: 8
    static_shape: "8x2048"
    measure: latency_ms
