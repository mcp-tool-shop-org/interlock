# Standards compliance
#
# PIN_PER_STEP: 2. Model, revision, licence, device, static shape, batch,
#   the prompt rule, the candidate gate and its margin, and the parity guard
#   are in this file before any run.
# ANDON_AUTHORITY: 2. A non-zero step stops the sequence. A parity miss marks
#   the arm invalid; it does not fail the run.
# NAMED_COMPENSATORS: 2. Unload drops the compiled cache. A fresh compile
#   cache is deleted after unload. No publish, no rental, no spend.
# DECOMPOSE_BY_SECRETS: 2. This file is the pre-registration. The harness
#   runs it. The verdict is computed from the receipt after the run.
# UNCERTAINTY_GATED_HUMANS: 2. One NPU/iGPU session inside a quiet CPU
#   window, booked through the Publisher. This spec does not start a device.
# EXTERNAL_VERIFIER: n/a. R&D reviews this spec before any device time.

# Amendment, 2026-10-10, before any E2 run (R&D, per the E1 rulings of 2026-10-09):
# the three NPU batch-8 arms moved to experiments/e2/spec-b8tail.yaml, which runs after this spec in the same
# booked session and quiet window, cheapest first, one try each. A device loss or hang there is a recorded row,
# later arms are marked not run, and nothing is retried. The decision is unchanged: the batch-8 rows were
# descriptive. A parity-invalid arm is stored with parity_valid: false and kept out of select and the gap report.
id: E2
procedure: interleaved
compile_cache: fresh
question: >
  Is Qwen3-Embedding-0.6B, as the official OpenVINO fp16 export pinned
  below, a candidate embedder worth a retrieval-benchmark slot? Speed on
  NPU, iGPU and CPU, and parity against its own CPU reference by length;
  no retrieval-quality claim is made here — quality comes from the
  pre-registered retrieval benchmark this run is meant to feed.
decision: >
  The model is a candidate embedder when two gates pass. The parity guard
  first — every arm's first repeat row must reach cosine >= 0.999 against
  the CPU batch-1 arm at the same length; a miss marks that arm invalid,
  and if misses appear only at the longest bucket that is recorded as a
  length finding, invalidating that length's arms only. The speed gate
  second — on at least one accelerator (NPU or iGPU), the warm p50 at
  batch 1 and length 512 must be at most 0.9 times the CPU warm p50 at the
  same shape, a 10 percent margin read from medians over 19 repeats so
  device noise alone cannot pass it. Both gates failing or any invalid
  arm at every length is a no-go, and the benchmark slot stays with the
  E1 set. Cold costs (compile_ms and compile_warm_reload_ms) and warm p95
  are recorded and reported, not gated. Warm throughput and the batch-8
  rows are descriptive. The band below is the validator formality, not
  the decision.
band: 1.0
warmups: 1
repeats: 19
rest_s: 900
needs:
  grant: false
  npu_session: true
  cpu_window: true
  booked_together: true
dataset:
  name: e2-fixed-prompt
  seed: "The switchyard counts the same cars on every pass. "
  target_tokens: 2048
  rule: >
    Repeat the seed until the model tokenizer counts at least 2048 tokens,
    then keep the shortest prefix of that repetition that still counts as
    2048. Every arm gets the same prefix; the adapter right-truncates to
    the arm's static length, so every device sees byte-identical tokens at
    each length. The dropped count is recorded as truncated_tokens. No
    instruction prefix is prepended — E2 measures identical generic tokens
    for speed and parity, not the retrieval recipe. Every E2 row carries
    the label "speed and parity only; not the retrieval recipe".
metrics:
  - compile_ms
  - compile_warm_reload_ms
  - first_call_ms
  - latency_ms
  - throughput
  - truncated_tokens
stop_rules:
  - A non-zero step stops the sequence. Later arms do not run.
  - Every arm is static-shaped on every device, so all devices see
    identical tokens and identical shapes per length.
  - Cold is once per arm on its fresh compile cache and stays out of the
    percentiles; the cold row carries compile_ms and
    compile_warm_reload_ms, and first-call time beside them.
  - Repeats are deterministic — the same artifact and the same tokens give
    the same vector, so the parity guard reads the first repeat row.
  - The pin is the official OpenVINO export OpenVINO/Qwen3-Embedding-0.6B-fp16-ov at 82a0035040926a5c0dcf251209218e096c5eeb1c,
    licence apache-2.0 verified on the hub this week. The fp16 IR is the
    parity-faithful choice — the CPU reference runs the same artifact.
  - Pooling is last-token, the model card's recipe, pinned in the adapter
    table and recorded per row.
  - E2 arms are an embedding model, so the batch-8 cross-encoder refusal
    does not apply. Every measured call carries the adapter's automatic
    60 second per-call bound — a hang returns ok=False, marks the arm
    inconclusive, poisons the model+device pair for the run, and the
    runner's non-zero-step stop ends the sequence and the session.
  - The NPU, iGPU and CPU arms run in one booked block inside a quiet CPU
    window. The 900 second rest is taken before the block, not between
    arms.
  - Booked through the Publisher; never beside a timed calibration or the
    math ladder on the 5090.
  - Retrieval quality, calibration and any benchmark placement belong to
    the later retrieval benchmark, not this run. Every row this run writes
    is labelled "speed and parity only; not the retrieval recipe", and that
    label travels into the report.
arms:
  - id: qwen3emb-cpu-l128-b1
    task: embed
    device: CPU
    engine: openvino
    model: OpenVINO/Qwen3-Embedding-0.6B-fp16-ov@82a0035040926a5c0dcf251209218e096c5eeb1c
    revision_or_digest: 82a0035040926a5c0dcf251209218e096c5eeb1c
    quant: fp16
    licence: apache-2.0
    engine_version: "2026.4.1"
    thinking_level: "off"
    num_predict: null
    num_ctx: null
    batch: 1
    static_shape: "1x128"
    measure: latency_ms
