metrics:
  - compile_ms
  - first_call_ms
  - latency_ms
  - throughput
stop_rules:
  - A non-zero step stops the sequence. Later arms do not run.
  - The pins are official OpenVINO exports, channel-wise int4 only —
    OpenVINO/Qwen3-8B-int4-cw-ov at 27ae5b116eb7e6df79bac2ca7b7c0c9f63f79cb7 (apache-2.0) and OpenVINO/Phi-3.5-mini-instruct-int4-cw-ov at
    dc27b4e451118b1e82c159a839476df02797837a (mit). Licences verified on the hub this week. The gemma
    alternative was rejected in this spec — its export has no root
    openvino_model.xml and its licence is the Gemma terms of use.
  - Thinking levels name the prompt switch, recorded per row; Qwen3 has
    it, Phi does not and runs thinking-off rows only.
  - Decode throughput and TTFT come from openvino-genai's own performance
    counters, echoed raw under resolved.genai; latency_ms is the whole
    call. With 5 repeats the p95 is the top sample; that is known and
    accepted rather than a longer run.
  - The NPU/iGPU/CPU arms are one block in a quiet CPU window with the
    900 second rest before it. The 5090 reference arms are a separate
    grant, rested separately, never beside this block.
  - compile_cache is reuse — generation IRs are too large to pay a fresh
    compile per arm. Compile time is recorded per first load; a
    warm-reload row is not part of E3's decision. If a later E3 follow-up
    needs reload cost it will say so, pre-registered.
  - Every measured call carries the adapter's automatic 60 second
    per-call bound. A hang marks the arm inconclusive, poisons the pair,
    stops the sequence and ends the session; the process ends, the done
    line says so, and the NPU gets a health check before its next
    session.
  - Booked through the Publisher; never beside a timed calibration or the
    math ladder on the 5090.
  - Outputs are captured for eyeballing; no quality claim is made from
    them.
