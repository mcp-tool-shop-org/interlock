id: E3
procedure: interleaved
compile_cache: reuse
question: >
  Can the Intel side host an always-on small generator, and at what
  latency? Two channel-wise int4 models (group-quant IRs reportedly crash
  the NPU compiler, so cw builds only) through openvino-genai on NPU, iGPU
  and CPU — compile, time to first token and decode tokens per second at
  prompts of about 256, 1024 and 4096 tokens, thinking off and on where
  the model has it. Outputs are captured. No quality claim.
decision: >
  Viability — an always-on small generator is viable on the Intel side
  when at least one of the two models, on at least one Intel device,
  reaches decode throughput of 15 tokens per second or more at the
  1024-token prompt with thinking off; 15 tok/s is the fixed floor for
  assistant-grade background work, chosen before any run. TTFT, the other
  lengths and the thinking-on rows accompany the verdict. The expectation
  check is recorded separately — whether NPU decode is slower than iGPU
  and CPU decode for each model, the community finding to confirm or
  refute; a recorded hypothesis, not the viability gate. The 5090
  reference (qwen3:8b via Ollama at the 1024 prompt) is for speed only,
  runs inside its own grant, and is compared as descriptive ratios.
