# Standards compliance
#
# PIN_PER_STEP: 2. Models, revisions, licences, devices, prompt lengths,
#   the thinking switch, the viability floor and the expectation check are
#   in this file before any run.
# ANDON_AUTHORITY: 2. A non-zero step stops the sequence. A hang is a call
#   past the arm's per-call bound (see the amendment below) — arm
#   inconclusive, pair poisoned, sequence stopped, session ends.
# NAMED_COMPENSATORS: 2. Unload drops the pipelines. No publish, no rental,
#   no spend. Outputs are captured for eyeballing only.
# DECOMPOSE_BY_SECRETS: 2. This file is the pre-registration. The harness
#   runs it. The verdict is computed from the receipt after the run.
# UNCERTAINTY_GATED_HUMANS: 2. An NPU/iGPU session, booked with the
#   Publisher. The 5090 reference moved to experiments/e3-ref and runs by
#   R&D or Grok's hand. This spec starts no device.
# EXTERNAL_VERIFIER: n/a. R&D reviews this spec before any device time.

# Amendment, 2026-10-10, before any E3 run (R&D rulings on switchyard issue #36).
#
# Per-call bound. The adapter's fixed 60 s per-call bound is replaced by a
# per-arm bound on every device, the rule E2 adopted the same day. A cold
# call is bounded by the ceiling C, call_ceiling_s below (600 s). Each later
# call of an arm is bounded by min(C, max(60 s, 3 x that arm's own cold-call
# time)), with the compile excluded. Exceeding the bound is still a hang:
# arm inconclusive, pair poisoned, sequence stopped, nothing retried. Every
# row records bound_s and cold_call_s. Why E3 needs it: its 8B generate arms
# at the longest prompt can exceed 60 s per call on the CPU and the NPU, and
# under the old bound a slow but working arm would have stopped the run as a
# hang. Nothing else in this spec changes: models, revisions, prompt lengths,
# the thinking switch, the viability floor and the expectation check stand.

# Amendment, 2026-10-10. Rest. rest_s is the length of a conditional rest,
# applied only after a run of over 30 minutes on the same devices that ended
# less than rest_s ago (maintainer, 2026-10-10).

# Amendment, 2026-10-10, after e3-2026-10-10c's RAM stop (R&D ruling; harness #47 and #48).
#
# Why. e3-2026-10-10c was hard-killed at 89.2% system RAM (2-s sample 95%) as
# pipelines piled up: under the interleaved order across all 27 arms, every
# (model, device, compile config) generate pipeline stays resident at once, and
# on the NPU that is one per prompt length (#45). On a 63 GB machine with the
# 57% shared-memory override it does not fit. e3-2026-10-10b and -10c are kept
# as evidence; neither produced a row.
#
# Order. order: blocked replaces whole-run interleaving for E3 only. One block
# per (model, device) on CPU and iGPU, holding all lengths and both thinking
# modes: one generate pipeline serves every length there (the compile config
# does not vary by prompt). On the NPU, one block per (model, length, thinking
# mode): MAX_PROMPT_LEN is the prompt's token count + 64, and "/no_think"
# changes the token count, so each thinking mode needs its own pipeline. Inside
# a block the existing interleaved procedure applies to that block's arms:
# cold once per arm, warmups 1, repeats 5, the per-arm call bound. Between
# blocks the block's rows are flushed, its pipeline unloaded, and system RAM
# must return within 3 GiB of the run's starting baseline within 60 s, or the
# run stops cleanly. At most one generate pipeline is resident at any time.
#
# Block order, cheapest and least risky first: Phi-3.5 before Qwen3-8B; within
# each model CPU, then iGPU, then NPU by length (l256, l1024, l4096), thinking
# off before on.
#
# Memory guard, in the harness: system RAM is sampled every 2 s; a pipeline
# build that would cross 85% (used RAM + the largest measured build step for the
# model; 12 GiB for the 8B and 6 GiB for Phi before the first measurement) is
# refused and its block is not run, "memory headroom", which is not a capability
# result; an 88% crossing at any time stops the run cleanly.
#
# Compile bound: compile_ceiling_s is 900. A pipeline build past it is a
# compile_timeout capability row (provisional, scoped to model x device x
# compile config), never retried.
#
# Drift check, descriptive and not a gate: devices are now measured at
# different times, so phi-35-mini-cpu-l256 is run again at the end as a drift
# block (warm only, 5 repeats). Its compulsory warmup absorbs the pipeline
# rebuild after the Qwen NPU blocks unloaded everything; the warmup is discarded
# and the ratio (drift warm decode tok/s / first block's warm decode tok/s) uses
# the warm repeats only. Drift rows are descriptive and stay out of the routing
# table. The NPU-versus-iGPU/CPU expectation check now compares across time; the
# drift ratio is its context, and the readout says so.
#
# Unchanged: models, revisions, prompts, num_predict 128, the thinking switch,
# the 15 tok/s viability floor at l1024 thinking off, the expectation check
# (descriptive), rest_s (conditional), call_ceiling_s and compile_cache reuse.

# Amendment, 2026-10-11 (maintainer). Rest is the Publisher's scheduling decision between consecutive long runs, not a harness rule; rest_s below is no longer read.
# Amendment, 2026-10-11 (maintainer, R&D ruling), added after the run, for future runs: decision_metric:
# latency.throughput. Every finished arm must report decode tok/s; the first finished arm without it stops
# the run. It was not pre-registered for e3-2026-10-11b and changes nothing that run measured.
id: E3
procedure: interleaved
order: blocked
compile_ceiling_s: 900
blocks:
  - id: phi-cpu
    arms: [phi-35-mini-cpu-l256, phi-35-mini-cpu-l1024, phi-35-mini-cpu-l4096]
  - id: phi-igpu
    arms: [phi-35-mini-igpu-l256, phi-35-mini-igpu-l1024, phi-35-mini-igpu-l4096]
  - id: phi-npu-l256
    arms: [phi-35-mini-npu-l256]
  - id: phi-npu-l1024
    arms: [phi-35-mini-npu-l1024]
  - id: phi-npu-l4096
    arms: [phi-35-mini-npu-l4096]
  - id: qwen-cpu
    arms: [qwen3-8b-cpu-l256, qwen3-8b-cpu-l256-think, qwen3-8b-cpu-l1024, qwen3-8b-cpu-l1024-think, qwen3-8b-cpu-l4096, qwen3-8b-cpu-l4096-think]
  - id: qwen-igpu
    arms: [qwen3-8b-igpu-l256, qwen3-8b-igpu-l256-think, qwen3-8b-igpu-l1024, qwen3-8b-igpu-l1024-think, qwen3-8b-igpu-l4096, qwen3-8b-igpu-l4096-think]
  - id: qwen-npu-l256
    arms: [qwen3-8b-npu-l256]
  - id: qwen-npu-l256-think
    arms: [qwen3-8b-npu-l256-think]
  - id: qwen-npu-l1024
    arms: [qwen3-8b-npu-l1024]
  - id: qwen-npu-l1024-think
    arms: [qwen3-8b-npu-l1024-think]
  - id: qwen-npu-l4096
    arms: [qwen3-8b-npu-l4096]
  - id: qwen-npu-l4096-think
    arms: [qwen3-8b-npu-l4096-think]
drift_block:
  id: phi-cpu-drift
  repeat_of: phi-cpu
  arms: [phi-35-mini-cpu-l256]
  repeats: 5
compile_cache: reuse
question: >
  Can the Intel side host an always-on small generator, and at what
  latency? Two channel-wise int4 models (group-quant IRs reportedly crash
  the NPU compiler, so cw builds only) through openvino-genai on NPU, iGPU
  and CPU — compile, time to first token and decode tokens per second at
  prompts of about 256, 1024 and 4096 tokens, thinking off and on where
  the model has it. Outputs are captured. No quality claim.
decision: >
  Viability — an always-on small generator is viable on the Intel side
  when at least one of the two models, on at least one Intel device,
  reaches decode throughput of 15 tokens per second or more at the
  1024-token prompt with thinking off; 15 tok/s is the fixed floor for
  assistant-grade background work, chosen before any run. TTFT, the other
  lengths and the thinking-on rows accompany the verdict. The expectation
  check is recorded separately — whether NPU decode is slower than iGPU
  and CPU decode for each model, the community finding to confirm or
  refute; a recorded hypothesis, not the viability gate. The 5090
  reference is spec e3-ref (qwen3:8b via Ollama at the 1024 prompt,
  thinking off and on), run by R&D or Grok inside their own grant. When
  both receipts exist, the descriptive ratio per thinking mode is
  R_speed = this run's warm decode tok/s at 1024 / e3-ref's warm decode
  tok/s at 1024, read across the two receipts — context, not a gate.
band: 1.0
warmups: 1
repeats: 5
rest_s: 900
decision_metric: latency.throughput
call_ceiling_s: 600
needs:
  grant: false
  npu_session: true
  cpu_window: true
  booked_together: true
dataset:
  name: e3-fixed-prompts
  seed: "The switchyard counts the same cars on every pass. "
  target_prompts: [256, 1024, 4096]
  rule: >
    The prompt texts are the YAML anchors below, built from the seed
    repeated 22, 86 and 342 times (about 12 tokens per repetition, so
    about 256, 1024 and 4096 tokens — the tokenizer's exact count is
    recorded, not assumed). Qwen3 thinking-off arms use the NT anchors,
    which append the model card's "/no_think" switch; thinking-on and Phi
    arms use the plain anchors. num_predict caps every generation at 128
    tokens so a thinking-on row stays bounded; the cap is recorded, never
    retried longer.
