# Standards compliance
#
# PIN_PER_STEP: 2. The roster digests, the 2048 grid, 30500 MiB and 31200 MiB,
#   the 256 MiB shared-memory spill threshold, and the 0.5 prompt-rate
#   ratio are in this file.
# ANDON_AUTHORITY: 2. The sampler aborts at 30500 MiB and unloads. It does not
#   wait for the watchdog, and it never loads up to 31200 MiB.
# NAMED_COMPENSATORS: 2. Unload is keep_alive 0. No publish and no rental.
# DECOMPOSE_BY_SECRETS: 2. This file is the pre-registration. The search is code.
# UNCERTAINTY_GATED_HUMANS: 2. One grant per model, from the Publisher, with the
#   900 second rest between models. This spec does not start a device.
# EXTERNAL_VERIFIER: n/a. R&D reviews this spec before any device time.

id: E5
procedure: fill-card
question: >
  For each named local 5090 model, what is the largest num_ctx that stays fully
  resident and at or under 30500 MiB, including the peak while a long prompt
  is processed?
decision: >
  The row is that num_ctx and the VRAM at the confirmed peak. offrig may later
  read it as the ceiling for num_ctx auto. A window that fails residency or
  exceeds 30500 MiB steps back one 2048 notch. So does a spill. Spill means the
  Ollama runner's shared GPU memory grew by more than 256 MiB over the
  post-load reading, or the prompt-processing rate fell below half the
  default-context rate. Growth of exactly 256 MiB is not a spill. Time to first
  token and decode tokens per second are recorded and are not gates. No
  confirmed window means the model has no fill-the-card row. Do not invent one.
abort_mib: 30500
ceiling_mib: 31200
grain: 2048
confirm_prompt_fraction: 0.9
confirm_num_predict: 1
sample_ms: 200
spill_shared_mib: 256
spill_prompt_ratio: 0.5
max_ctx: 1048576
shift: false
truncate: false
rest_s: 900
needs:
  grant: true
  npu_session: false
  cpu_window: false
dataset:
  name: e5-confirm-prompt
  seed: "The switchyard fills the card with the same sentence. "
  rule: >
    The load uses num_predict 1. Confirmation uses a prompt of about 90 percent
    of the candidate window, built by repeating the seed until the tokenizer
    reaches that count, then keeping the shortest such prefix. shift and
    truncate are both false, so a full window is an error and not a silent shift.
metrics:
  - max_resident_ctx
  - peak_mib
  - ttft_ms
  - decode_tok_s
  - prompt_tok_s
  - shared_mib
  - idle_baseline_mib
stop_rules:
  - Abort and unload the moment card VRAM reaches 30500 MiB. Do not test 31200 MiB. Do not rely on the watchdog. Ollama's runner is not on the watchdog's kill list.
  - Fully resident means the loaded model reports size_vram equal to size, and the server log for that load shows every layer on the GPU.
  - Double from the model's own default context, read at run time and written on the receipt. Do not invent a default in this file. Then bisect on a 2048-token grid between the last pass and the first fail.
  - Confirmation samples nvidia-smi about every 200 ms through the long prompt. The reported VRAM is that peak.
  - "Spill is shared GPU memory growth, then prompt-processing rate. The counter is \\GPU Process Memory(*)\\Shared Usage on the Ollama runner. The threshold is 256 MiB over the post-load shared usage of the default-context load. The secondary gate is prompt_eval_count / prompt_eval_duration below 0.5 times that same load. Both numbers are pre-registered. Growth of exactly 256 MiB is not a spill. A missing shared-usage reading or a missing prompt rate is a spill, not a pass. Decode tokens per second and raw time to first token are recorded and do not step the search back. Dedicated Usage is the same counter family and is recorded when a probe returns it. It is not a gate."
  - Read quantization_level and the single model_info context length from Ollama /api/show when the run starts. num_ctx on the receipt is that context length. A missing quantization level is written unrecorded. A failed show is a failed step. Do not invent either value in this file.
  - The 700 MiB between 30500 and 31200 is the margin that is never tested. The first run logs desktop VRAM variance. Amend it only in a committed spec change before a later run.
  - One grant per model. Rest 900 seconds between models, with the card empty.
  - A row is stale when the Ollama version, the CUDA backend, the ggml-cuda sha, the digest, the quantization, flash attention, the KV cache type, the idle baseline, or the NVIDIA driver version changes.
  - Continue-at-a-bigger-window stays escalate-only and is not part of this experiment. Paged KV is not measured. 8-bit KV is not a silent setting.
